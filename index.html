<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LiveWinkel — Legal</title>
  <meta name="description" content="Legal documents for the LiveWinkel app." />
  <style>
    :root {
      --bg: #ffffff; --fg: #1a1a1a; --muted: #5c5c5c; --rule: #e6e6e6;
      --accent: #b45309; --card: #fafafa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212; --fg: #ededed; --muted: #a3a3a3; --rule: #2a2a2a;
        --accent: #f59e0b; --card: #1b1b1b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6; padding: 1.5rem;
    }
    .card { width: 100%; max-width: 30rem; }
    .brand { font-weight: 800; font-size: 1.4rem; letter-spacing: -0.01em; margin: 0 0 0.25rem; }
    p.sub { color: var(--muted); margin: 0 0 1.5rem; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.6rem; }
    a.doc {
      display: block; text-decoration: none; color: var(--fg);
      background: var(--card); border: 1px solid var(--rule); border-radius: 12px;
      padding: 0.9rem 1rem; font-weight: 600;
    }
    a.doc:hover { border-color: var(--accent); }
    a.doc .arrow { float: right; color: var(--accent); }
    .soon { color: var(--muted); font-weight: 400; font-size: 0.9rem; }
    footer { margin-top: 1.5rem; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="card">
    <p class="brand">LiveWinkel</p>
    <p class="sub">Legal documents</p>
    <ul>
      <li><a class="doc" href="privacy.html">Privacy Policy <span class="arrow">→</span></a></li>
      <li><span class="doc" style="opacity:.6;cursor:default">Terms &amp; Conditions <span class="soon">— coming soon</span></span></li>
    </ul>
    <footer>Draft — not yet legally reviewed.</footer>
  </div>
</body>
</html>
